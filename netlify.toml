[build]
  command = "git submodule update --init --recursive && python3 scripts/obsidian_to_hugo.py && hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.1"
  
[context.production.environment]
  HUGO_ENV = "production"

# Files in static/Templates/ are Obsidian templates meant to be downloaded,
# not viewed: make browsers save them instead of showing raw Markdown text.
[[headers]]
  for = "/Templates/*"
  [headers.values]
    Content-Disposition = "attachment"
